<mat-card class="login-card">

    <h2 class="text-2xl mb-5 text-blue-500">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="Enter your email" />
            <mat-error class="err-msg" *ngIf="loginForm.get('email')?.hasError('required')">
                Email is required
            </mat-error>
            <mat-error class="err-msg" *ngIf="loginForm.get('email')?.hasError('email')">
                Enter a valid email
            </mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password" />
            <mat-error class="err-msg" *ngIf="loginForm.get('password')?.hasError('required')">
                Password is required
            </mat-error>
        </mat-form-field>
        <button mat-raised-button class="!bg-blue-500 !text-white !rounded disabled:!opacity-50" type="submit" [disabled]="loginForm.invalid">
            Login
        </button>
    </form>

</mat-card>
