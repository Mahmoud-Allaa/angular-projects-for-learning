<div class="container mx-auto mt-24 bg-[#f8f8f8] shadow-md p-10 rounded">
    <h2 class="text-2xl mb-5 text-blue-500">Add New Recipe</h2>

    <form class="flex flex-col gap-4" [formGroup]="newRecipeForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Title</mat-label>
            <input matInput type="text" formControlName="title" placeholder="Enter the recipe title" />
            <mat-error class="!text-red-500" *ngIf="newRecipeForm.get('title')?.hasError('required')">
                Title is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" placeholder="Enter the recipe description"></textarea>
            <mat-error class="!text-red-500" *ngIf="newRecipeForm.get('description')?.hasError('required')">
                Description is required
            </mat-error>
        </mat-form-field>

        <button mat-raised-button class="!bg-blue-500 !text-white !rounded disabled:!opacity-50" type="submit" [disabled]="newRecipeForm.invalid">
            Submit Recipe
        </button>
    </form>
</div>
