<app-page-header
    title="Product Details" [breadcrumbs]="[{ label: 'Home', url: '/' },{ label: 'Shop', url: '/shop' }, { label: 'Product Details' }]"
></app-page-header>

<div class="container mx-auto my-20 bg-white p-6 rounded-lg shadow-md flex flex-row gap-1">
    <div class="flex-1 flex-row flex gap-4 items-center">
        <div class="flex flex-col justify-between h-full gap-4">
            <img [src]="product?.image" alt="{{ product?.name }}" class="w-[150px] h-[150px] object-contain rounded-lg bg-tertiary-light p-5">
            <img [src]="product?.image" alt="{{ product?.name }}" class="w-[150px] h-[150px] object-contain rounded-lg bg-tertiary-light p-5">
            <img [src]="product?.image" alt="{{ product?.name }}" class="w-[150px] h-[150px] object-contain rounded-lg bg-tertiary-light p-5">
        </div>
        <img [src]="product?.image" alt="{{ product?.name }}" class="w-[350px] h-full object-contain rounded-lg bg-tertiary-light p-10">
    </div>
    <div class="flex-1 text-primary">
        <h2 class="">{{ product?.title }}</h2>
        <p class="text-secondary font-semibold mt-2">{{ product?.price | currency }}</p>
        <p class="text-gray-400 mt-5">{{ product?.description }}</p>
        <p class="mt-5">Category: {{ product?.category }}</p>
        <button (click)="addToCart()" class="mt-20 secondary-btn">Add to Cart</button>
    </div>
</div>
