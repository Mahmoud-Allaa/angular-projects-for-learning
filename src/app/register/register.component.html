<div class="p-4 bg-[#f9f9f9] shadow-md mt-24 w-[500px] mx-auto rounded">
    <h2 class="text-2xl mb-5 text-blue-500">Register</h2>

    <form class="flex flex-col gap-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput type="username" formControlName="username" placeholder="Enter your username" />
            <mat-error class="!text-red-500" *ngIf="registerForm.get('username')?.hasError('required')">
                username is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="Enter your email" />
            <mat-error class="!text-red-500" *ngIf="registerForm.get('email')?.hasError('required')">
                Email is required
            </mat-error>
            <mat-error class="!text-red-500" *ngIf="registerForm.get('email')?.hasError('email')">
                Enter a valid email
            </mat-error>
        </mat-form-field>

        <mat-form-field class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password" />
            <mat-error class="!text-red-500" *ngIf="registerForm.get('password')?.hasError('required')">
                Password is required
            </mat-error>
        </mat-form-field>
        <button mat-raised-button class="!bg-blue-500 !text-white !rounded disabled:!opacity-50" type="submit" [disabled]="registerForm.invalid">
            Register
        </button>
    </form>

</div>
